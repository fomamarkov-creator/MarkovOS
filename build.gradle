plugins {
    // Подключаем стабильный Android Gradle Plugin
    id 'com.android.application' version '8.2.2'
}

android {
    namespace 'com.banachos.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.banachos.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "8.3"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile(
                'proguard-android-optimize.txt'
            ), 'proguard-rules.pro'
        }
    }

    // Принудительно вшиваем нативный С++ бинарник V256
    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
}
