// 1. КОНТУР РЕПОЗИТОРИЕВ И ЗАГРУЗКИ АНДРОИД-ПЛАГИНОВ
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Подключаем стабильный Android Gradle Plugin
        classpath 'com.android.tools.build:gradle:8.2.2'
    }
}

plugins {
    id 'com.android.application' version '8.2.2' apply false
}

// Применяем плагин к нашему мобильному приложению
apply plugin: 'com.android.application'

repositories {
    google()
    mavenCentral()
}

android {
    namespace 'com.banachos.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.banachos.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "8.3"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile(
                'proguard-android-optimize.txt'
            ), 'proguard-rules.pro'
        }
    }

    // Принудительно вшиваем нативный С++ бинарник V256
    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
}
