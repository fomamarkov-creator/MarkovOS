name: BanachOS Core Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Source
        uses: actions/checkout@v4

      - name: Install System GNU Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ make
      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Pytest Verification Suite
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy

      - name: Execute BanachOS Bare-Metal Build
        run: |
          make clean
          make
      - name: Verify Core Telemetry via Pytest
        run: |
          pytest -v

      # ФИКС: Принудительный сбор и публикация бинарников V256 на сайт
      - name: Upload BanachOS Mobile Binary
        uses: actions/upload-artifact@v4
        with:
          name: banachos-binaries
          path: |
            *.so
            *.bin
            banachos_core
