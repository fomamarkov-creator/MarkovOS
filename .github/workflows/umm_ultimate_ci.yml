name: BanachOS Core Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Source
        uses: actions/checkout@v4

      - name: Install System GNU Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ make

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Pytest Verification Suite
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy torch cupy-cuda12x

      - name: Execute BanachOS Bare-Metal Build
        run: |
          make clean
          make
          # Прямая монолитная сборка в корень для тестов производительности Липшица
          g++ -std=c++20 -O3 main.cpp banachos_mem.cpp banachos_hal.cpp banachos_syscalls.cpp banachos_net.cpp banachos_crypto.cpp banachos_translator.cpp banachos_injector.cpp banachos_bgui.cpp banachos_bproc.cpp banachos_bcontainer.cpp banachos_baudio.cpp -o banachos_core
          # Прописываем файл во все подкаталоги репозитория для pytest
          cp banachos_core ./banachos_core
          find . -type d -exec cp banachos_core {}/banachos_core \; 2>/dev/null || true

      - name: Verify Core Telemetry via Pytest
        run: |
          pytest -v

      # Принудительный сбор и публикация бинарников V256 на сайт
      - name: Upload BanachOS Mobile Binary
        uses: actions/upload-artifact@v4
        with:
          name: banachos-binaries
          path: |
            *.so
            *.bin
            banachos_core
