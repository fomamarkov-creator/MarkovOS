name: UMM v8.3 Production Math Engine & Documentation CI

on:
  workflow_dispatch: # ИСКЛЮЧИТЕЛЬНО РУЧНОЙ ТРИГГЕР

permissions:
  contents: write # Разрешение боту GitHub Actions перезаписывать README.md

jobs:
  mathematical_validation_and_doc:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Enterprise Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Inject Strict Computational Stack
      run: |
        python -m pip install --upgrade pip
        pip install numpy pytest torch cupy-cuda12x

    - name: Execute Strict Matrix and Spectral Tests
      run: pytest test_ultimate.py -v -s

    - name: Compile Real-Time Report into README
      run: |
        python -c "
        import os
        
        # Защита на случай, если тесты пропустили генерацию отчета
        if not os.path.exists('umm_report.md'):
            print('Критическая ошибка: узел bDEBUG не сформировал umm_report.md')
            exit(1)
            
        with open('README.template.md', 'r', encoding='utf-8') as f:
            template = f.read()
        with open('umm_report.md', 'r', encoding='utf-8') as f:
            report = f.read()
            
        start_tag = '<!-- MARKOV_REPORT_START -->'
        end_tag = '<!-- MARKOV_REPORT_END -->'
        
        # Корректное строковое разделение шаблона по тегам-маркерам
        try:
            head, rest = template.split(start_tag, 1)
            _, tail = rest.split(end_tag, 1)
        except ValueError:
            print('Ошибка: В файле README.template.md не найдены обязательные маркерные теги!')
            exit(1)
            
        final_readme = head + start_tag + '\n' + report + '\n' + end_tag + tail
        with open('README.md', 'w', encoding='utf-8') as f:
            f.write(final_readme)
        "

    - name: Auto-Commit and Push Generated README
      run: |
        git config --local user.email "actions@github.com"
        git config --local user.name "GitHub Actions Bot"
        git add README.md
        git diff --quiet && git diff --staged --quiet || (git commit -m "docs: auto-update physical invariants table [skip ci]" && git push)
