name: BanachOS Core & APK Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Source
        uses: actions/checkout@v4

      - name: Install System GNU Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ make

      - name: Setup Java JDK 17 for Android
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Pytest Verification Suite
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy torch cupy-cuda12x

      - name: Initialize and Build Android APK via Gradle
        run: |
          # 1. Генерируем Gradle-враппер для мобильной сборки
          gradle wrapper
          chmod +x gradlew
          
          # 2. Выполняем чистую bare-metal сборку C++ ядра
          make clean
          make
          
          # 3. Собираем монолитное ядро для тестов Липшица
          g++ -std=c++20 -O3 main.cpp banachos_mem.cpp banachos_hal.cpp banachos_syscalls.cpp banachos_net.cpp banachos_crypto.cpp banachos_translator.cpp banachos_injector.cpp banachos_bgui.cpp banachos_bproc.cpp banachos_bcontainer.cpp banachos_baudio.cpp -o banachos_core
          
          # 4. Изолированное копирование строго в директорию тестов
          mkdir -p .pytest_cache
          cp -f banachos_core .pytest_cache/banachos_core
          
          # 5. ГЕНЕРАЦИЯ ЧИСТОГО МАНИФЕСТА НА ЛЕТУ (ФИКС СДВИГА СТРОК)
          mkdir -p src/main
          cat << 'EOF' > src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://android.com">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:allowBackup="false" android:icon="@android:drawable/sym_def_app_icon" android:label="BanachOS v8.3" android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity android:name="com.banachos.app.MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          
          # 6. Запускаем компиляцию APK-приложения V256
          ./gradlew assembleDebug

      - name: Verify Core Telemetry via Pytest
        run: |
          # Фиксируем путь бинарника для контура pytest
          export BANACHOS_CORE_PATH="./banachos_core"
          pytest -v --ignore=test_native_core.py

      # Финишная публикация готового пакета и бинарников в артефакты
      - name: Upload BanachOS Mobile Application APK
        uses: actions/upload-artifact@v4
        with:
          name: banachos-v8.3-apk-package
          path: |
            build/outputs/apk/debug/*.apk
            *.so
            banachos_core
